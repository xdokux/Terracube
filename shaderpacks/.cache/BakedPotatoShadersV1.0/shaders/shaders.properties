# Baked Potato Shaders V8.0 — Aurora Debug Mode (Player Toggle)
# Iris-first, OptiFine-compatible shaderpack configuration.

oldLighting=false
oldHandLight=false
separateAo=false
underwaterOverlay=false
vignette=false
clouds=fancy
sun=true
moon=true
stars=false
sky=true

# Independent post-rain rainbow clock. In Iris 26.1, smooth() converts its
# fade parameter with a 0.1-second scale, so 50.0 is a 5-second half-life.
# Four half-lives reach the existing 0.0625 cutoff at exactly 20 seconds.
variable.float.rainbowTimerRaw=smooth(71, if(rainStrength > 0.0, 1.0, 0.0), 0.0, 50.0)
uniform.float.rainbowTimer=if(rainbowTimerRaw > 0.0625, rainbowTimerRaw, 0.0)

# Smooth camera-biome fog state. These CPU-side targets only feed the
# Overworld atmospheric fog include; Nether and End use separate fog pipelines.
# Temperate biomes intentionally fall through to the neutral 1.0 defaults.
variable.bool.biomeFogLush=in(biome_category, CAT_JUNGLE)
variable.bool.biomeFogWarm=in(biome_category, CAT_SAVANNA)
variable.bool.biomeFogHot=in(biome_category, CAT_DESERT, CAT_MESA)
variable.bool.biomeFogCold=in(biome_category, CAT_ICY) || biome_precipitation == PPT_SNOW
variable.bool.biomeFogOcean=in(biome_category, CAT_OCEAN)
variable.bool.biomeFogSwamp=in(biome_category, CAT_SWAMP)
variable.bool.biomeFogMushroom=in(biome_category, CAT_MUSHROOM)
variable.bool.biomeFogMountain=in(biome_category, CAT_EXTREME_HILLS)

# Final restrained cinematic palette. Biome detection, classification order,
# smoothing IDs/timings, and density targets remain unchanged.
# RGB targets are luminance-matched in GLSL before their 30% colour influence,
# preventing biome tuning from changing fog brightness.
variable.float.biomeFogTargetR=if(biomeFogLush, 0.790, biomeFogWarm, 0.820, biomeFogHot, 0.900, biomeFogCold, 0.840, biomeFogOcean, 0.760, biomeFogSwamp, 0.790, biomeFogMushroom, 0.820, biomeFogMountain, 0.900, 0.800)
variable.float.biomeFogTargetG=if(biomeFogLush, 0.860, biomeFogWarm, 0.870, biomeFogHot, 0.840, biomeFogCold, 0.890, biomeFogOcean, 0.880, biomeFogSwamp, 0.780, biomeFogMushroom, 0.810, biomeFogMountain, 0.910, 0.850)
variable.float.biomeFogTargetB=if(biomeFogLush, 0.790, biomeFogWarm, 0.800, biomeFogHot, 0.740, biomeFogCold, 0.940, biomeFogOcean, 0.930, biomeFogSwamp, 0.740, biomeFogMushroom, 0.880, biomeFogMountain, 0.920, 0.900)
variable.float.biomeFogTargetDensity=if(biomeFogLush, 1.025, biomeFogWarm, 1.010, biomeFogHot, 1.008, biomeFogCold, 0.965, biomeFogOcean, 0.975, biomeFogSwamp, 1.035, biomeFogMushroom, 1.000, biomeFogMountain, 0.945, 1.000)

uniform.float.biomeFogTintR=smooth(51, biomeFogTargetR, 12.0, 12.0)
uniform.float.biomeFogTintG=smooth(52, biomeFogTargetG, 12.0, 12.0)
uniform.float.biomeFogTintB=smooth(53, biomeFogTargetB, 12.0, 12.0)
uniform.float.biomeFogDensity=smooth(54, biomeFogTargetDensity, 12.0, 12.0)

# Overworld stars and aurora are rendered procedurally in gbuffers_skybasic.
# Minecraft cloud geometry uses the original gbuffers_clouds program.

# Nether celestial geometry is disabled explicitly. The Nether atmosphere is rendered
# independently in shaders/nether/composite.fsh when the depth buffer contains sky.
program.nether/gbuffers_skybasic.enabled=false
program.nether/gbuffers_skytextured.enabled=false

# End sky geometry is disabled explicitly. The End deep-space atmosphere and
# procedural nebula field are rendered independently in shaders/end/composite.fsh.
program.end/gbuffers_skybasic.enabled=false
program.end/gbuffers_skytextured.enabled=false
program.end/gbuffers_clouds.enabled=false
program.end/gbuffers_weather.enabled=false
program.end/shadow.enabled=false

shadowTerrain=true
shadowTranslucent=false
shadowEntities=true
shadowBlockEntities=true
shadowPlayer=false

screen=<empty> <profile> <empty> [LIGHTING] [ATMOSPHERE] [WATER] [POST]
screen.columns=3
screen.LIGHTING=shadowMapResolution shadowDistance SHADOW_QUALITY CAVE_BRIGHTNESS
screen.ATMOSPHERE=FOG_DENSITY COLOR_WARMTH SATURATION WAVING_PLANTS WAVING_LEAVES AURORA_DEBUG_MODE
screen.WATER=WATER_QUALITY
screen.POST=BLOOM_QUALITY BLOOM_STRENGTH EXPOSURE
screen.LIGHTING.columns=2
screen.ATMOSPHERE.columns=2
screen.WATER.columns=1
screen.POST.columns=2

profile.PERFORMANCE=shadowMapResolution=1024 shadowDistance=64.0 SHADOW_QUALITY=1 BLOOM_QUALITY=0 BLOOM_STRENGTH=0.0 WATER_QUALITY=0 WAVING_PLANTS !WAVING_LEAVES FOG_DENSITY=0.85 CAVE_BRIGHTNESS=1.05 COLOR_WARMTH=1.0 SATURATION=1.0 EXPOSURE=1.0
profile.BALANCED=shadowMapResolution=1536 shadowDistance=96.0 SHADOW_QUALITY=1 BLOOM_QUALITY=1 BLOOM_STRENGTH=0.18 WATER_QUALITY=1 WAVING_PLANTS WAVING_LEAVES FOG_DENSITY=1.0 CAVE_BRIGHTNESS=1.0 COLOR_WARMTH=1.0 SATURATION=1.0 EXPOSURE=1.0
profile.QUALITY=shadowMapResolution=2048 shadowDistance=128.0 SHADOW_QUALITY=2 BLOOM_QUALITY=2 BLOOM_STRENGTH=0.22 WATER_QUALITY=2 WAVING_PLANTS WAVING_LEAVES FOG_DENSITY=1.0 CAVE_BRIGHTNESS=1.0 COLOR_WARMTH=1.05 SATURATION=1.02 EXPOSURE=1.0

sliders=shadowMapResolution shadowDistance BLOOM_STRENGTH FOG_DENSITY CAVE_BRIGHTNESS COLOR_WARMTH SATURATION EXPOSURE

blend.gbuffers_line=off
blend.composite=off
blend.final=off
rain.depth=false
beacon.beam.depth=false


# Nether biome atmosphere state (used only by shaders/world-1).
uniform.float.netherSoulSand=smooth(41, if(in(biome, BIOME_SOUL_SAND_VALLEY), 1.0, 0.0), 10, 10)
uniform.float.netherCrimson=smooth(42, if(in(biome, BIOME_CRIMSON_FOREST), 1.0, 0.0), 10, 10)
uniform.float.netherWarped=smooth(43, if(in(biome, BIOME_WARPED_FOREST), 1.0, 0.0), 10, 10)
uniform.float.netherBasalt=smooth(44, if(in(biome, BIOME_BASALT_DELTAS), 1.0, 0.0), 10, 10)
