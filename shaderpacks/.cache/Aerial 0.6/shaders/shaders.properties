# ============================================================
#  AETHER — Cinematic HDR Shaders for Iris & OptiFine
#  Physically inspired atmosphere, AgX color pipeline
# ============================================================

clouds=off
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
separateAo=true
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true

sun=false
moon=false

# Buffer formats: HDR color chain
# colortex0 = main HDR color (RGBA16F)
# colortex1 = gbuffer normals + material id
# colortex2 = albedo
# colortex3 = bloom / glare chain
# colortex4 = exposure history (1x1, persistent)
# colortex5 = temporal / aux

alphaTest.gbuffers_skybasic=off

# ---------------- Settings menu ----------------
screen=<empty> [ATMOSPHERE] [LIGHTING] [CAMERA] [WATER] <empty> SHADOW_QUALITY GI_STRENGTH

screen.ATMOSPHERE=SKY_DENSITY HAZE_HUMIDITY CLOUDS_ENABLED CLOUD_COVERAGE CLOUD_QUALITY FOG_STORM_BOOST
screen.LIGHTING=SUN_INTENSITY SSGI_ENABLED GI_SAMPLES GI_DISTANCE SSAO_STRENGTH CONTACT_SHADOWS LIGHTNING_FLASH <empty> LABPBR POM POM_DEPTH POM_SAMPLES POM_DISTANCE
screen.CAMERA=EXPOSURE_BIAS GLARE_STRENGTH FILM_GRAIN CHROM_ABERRATION AUTO_EXPOSURE
screen.WATER=WATER_ABSORPTION CAUSTICS_ENABLED WATER_REFLECTIONS

sliders=SKY_DENSITY HAZE_HUMIDITY CLOUD_COVERAGE SUN_INTENSITY SSAO_STRENGTH EXPOSURE_BIAS GLARE_STRENGTH FILM_GRAIN CHROM_ABERRATION WATER_ABSORPTION GI_STRENGTH FOG_STORM_BOOST SHADOW_QUALITY GI_SAMPLES GI_DISTANCE POM_DEPTH POM_SAMPLES POM_DISTANCE
