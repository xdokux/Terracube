# =====================================================================
# UHD630-PerfShader
# Target: Intel UHD 630, 60fps minimum, Sodium 0.6.13 + Iris 1.8.8
# =====================================================================

# ---- Shadow map ----
# v1 used 1024/96 blocks, which works out to ~5.3 texels per block -
# too coarse to resolve a player-sized caster cleanly, hence the
# "blobby" shadow. Fix: raise resolution AND shrink distance together.
# 2048 / 64 blocks = ~16 texels per block (3x denser), and the smaller
# shadow distance also means fewer chunks get rendered into the shadow
# map each frame, which claws back some of the cost the higher
# resolution adds. Net fps impact should be small, but not zero -
# if you're tight on frame budget, see the README for what to trade
# back (I lowered godray sample count to compensate, see composite1.fsh).
shadowMapResolution=2048
shadowDistance=64.0
shadowDistanceRenderMul=1.0
# Only render the shadow map every other frame region is NOT exposed
# as a simple toggle in this Iris version to my knowledge - flagging
# this as a possible extra optimization to look up manually if you
# want to push further (search "shadow map caching Iris").

# ---- Buffer formats ----
# colortex0 = main scene color (default RGBA8, not declared = default)
# colortex1 = view-space normal (rgb, packed 0-1) + material mask (a)
#             a = 0.0 -> opaque terrain, a = 1.0 -> water/reflective
# colortex2 = bloom working buffer (bright-pass + horizontal blur,
#             consumed and cleared each frame by composite3.fsh)
colortex1Format=RGBA8
colortex2Format=RGBA8

# ---- User-facing sliders ----
# These just tell the in-game shader GUI which #defines to expose.
# The actual value RANGE for each slider is declared as an inline
# comment next to the #define itself, inside the .fsh files
# (this is the standard, well-documented OptiFine/Iris mechanism -
# I'm intentionally not using any shaders.properties slider-range
# syntax here since I'm not fully certain of its exact form in
# Iris 1.8.8 specifically, and getting it wrong would silently break
# the GUI rather than just failing to compile).
#
# SHADOW_MAP_BIAS is declared identically in shadow.vsh, gbuffers_terrain.vsh,
# gbuffers_water.vsh, and composite1.fsh - all four need the SAME value or
# shadow sampling will be misaligned, since it controls how shadow-space
# coordinates are warped both when writing AND reading the shadow map.
# The in-game slider should update all four together since they share
# the same macro name - flagging this as a "should work" rather than
# tested-and-confirmed behavior for Iris 1.8.8 specifically.
sliders=SHADOW_DARKNESS SHADOW_MAP_BIAS SHADOW_PCF_RADIUS COLORED_SHADOW_STRENGTH BLOCK_LIGHT_BRIGHTNESS GODRAY_STRENGTH GODRAY_MAX_DIST REFLECTION_STRENGTH BLOOM_THRESHOLD BLOOM_STRENGTH WATER_RIPPLE_STRENGTH WARMTH SATURATION CONTRAST

# ---- Notes ----
# No SSAO, no TAA, no volumetric fog (separate from godrays), no bloom.
# These are intentionally omitted - they are the most common cause of
# sub-60fps performance on integrated graphics and were not requested.
# Godrays are now a real shadow-map raymarch (not a screen-space trick),
# reflections now use binary-search refinement + Fresnel blending, and
# shadows now use distance-based distortion for a sharper near-player
# result - all of this costs a bit more than the previous version.
# If you drop below 60fps, the first two things to lower are
# GODRAY_STRENGTH's sample count (edit NUM_SAMPLES in composite1.fsh,
# not currently a slider since it's a loop bound) and SHADOW_PCF_RADIUS.
