# =====================================================================
# HyperShader — shaders.properties
# Configuración global + opciones del menú (Iris/OptiFine).
# =====================================================================

# --- Shadow map (PILAR 3) ---
# v1.1: shadowMapResolution y shadowDistance ahora viven en lib/common.glsl
# como consts con lista de opciones, para que los PERFILES puedan cambiarlas.

# Nota: la distancia de render (6-8 chunks) se ajusta en el menú normal de
# Minecraft (Video Settings > Render Distance).

# --- Perfiles (v1.1): un clic para elegir calidad global ---
# BALANCED = los valores por defecto. FAST apaga lo más caro. FANCY sube todo.
profile.FAST     = SHADOW_SAMPLES=2 SSR_STEPS=8 GODRAY_SAMPLES=12 POM_LAYERS=0 \
                   shadowMapResolution=1024 BLOOM=0 CLOUD_SHADOWS=0 CAUSTICS=0 \
                   REFRACTION=0 PUDDLES=0 FXAA=1
profile.BALANCED = SHADOW_SAMPLES=4 SSR_STEPS=16 GODRAY_SAMPLES=12 POM_LAYERS=16 \
                   shadowMapResolution=1536 BLOOM=1 CLOUD_SHADOWS=1 CAUSTICS=1 \
                   REFRACTION=1 PUDDLES=1 FXAA=1
profile.FANCY    = SHADOW_SAMPLES=8 SSR_STEPS=24 GODRAY_SAMPLES=12 POM_LAYERS=24 \
                   shadowMapResolution=2048 BLOOM=1 CLOUD_SHADOWS=1 CAUSTICS=1 \
                   REFRACTION=1 PUDDLES=1 FXAA=1

# --- Sliders (barras). El resto de opciones [0 1] salen como botón on/off. ---
sliders = SHADOW_SAMPLES SHADOW_SOFTNESS SSR_STEPS GODRAY_SAMPLES GODRAY_STRENGTH \
          POM_LAYERS POM_DEPTH SUN_BRIGHTNESS NIGHT_BRIGHTNESS INTERIOR_DARKEN \
          CLOUD_COVERAGE CLOUD_SPEED GALAXY_STRENGTH STAR_AMOUNT STAR_BRIGHTNESS \
          FOG_DENSITY NETHER_FOG WAVE_SPEED WAVE_STRENGTH \
          EXPOSURE SATURATION CONTRAST \
          WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_FOG_DENSITY UNDERWATER_DENSITY \
          LAVA_FLOW_SPEED LAVA_NOISE_SCALE LAVA_EMISSION_STRENGTH \
          BLOOM_STRENGTH BLOOM_SPREAD BLOOM_THRESHOLD \
          PUDDLE_AMOUNT CLOUD_SHADOW_STRENGTH RAINBOW_STRENGTH \
          CAUSTICS_STRENGTH REFRACTION_STRENGTH HANDLIGHT_STRENGTH \
          shadowMapResolution shadowDistance

# --- Pestañas del menú de shaders ---
screen = <profile> <empty> [LUZ] [CIELO] [CLIMA] [AGUA] [LAVA] [VIENTO] [COLOR] [SOMBRAS] [PBR]

screen.LUZ     = SUN_BRIGHTNESS NIGHT_BRIGHTNESS INTERIOR_DARKEN GODRAY_STRENGTH GODRAY_SAMPLES FOG_DENSITY HANDLIGHT HANDLIGHT_STRENGTH
screen.CIELO   = CLOUDS CLOUD_COVERAGE CLOUD_SPEED GALAXY GALAXY_STRENGTH STAR_AMOUNT STAR_BRIGHTNESS SHOOTING_STARS STAR_TWINKLE NETHER_FOG
screen.CLIMA   = WET_EFFECTS PUDDLES PUDDLE_AMOUNT RAIN_RIPPLES CLOUD_SHADOWS CLOUD_SHADOW_STRENGTH RAINBOW RAINBOW_STRENGTH LIGHTNING_FLASH
screen.VIENTO  = WAVING WAVE_SPEED WAVE_STRENGTH
screen.COLOR   = EXPOSURE SATURATION CONTRAST FXAA
screen.AGUA    = WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_FOG_DENSITY UNDERWATER_DENSITY SSR_STEPS CAUSTICS CAUSTICS_STRENGTH REFRACTION REFRACTION_STRENGTH FOAM
screen.LAVA    = LAVA_FLOW_SPEED LAVA_NOISE_SCALE LAVA_EMISSION_STRENGTH BLOOM BLOOM_STRENGTH BLOOM_SPREAD BLOOM_THRESHOLD
screen.SOMBRAS = SHADOW_SAMPLES SHADOW_SOFTNESS shadowMapResolution shadowDistance
screen.PBR     = POM_LAYERS POM_DEPTH
