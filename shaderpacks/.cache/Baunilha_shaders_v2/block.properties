# MCBL Block Mapping
# Format: block.AABCCC = minecraft:block_id
# AA=15 (emissivo), BBB=subcategoria, CC=cor (01-50 luz, 51-75 tintura, 99 solido)
# Cores: 01/26=Verm 02/27=Laranja 03/28=Amarelo 04/29=VerdeLimao 05/30=Verde
#        06/31=VerdeCiano 07/32=Ciano 08/33=AzulCiano 09/34=Azul 10/35=Roxo
#        11/36=Rosa 12/37=RosaVerm 13-24/Pastel 25/50=Branco
#        51-74=Tint 75=Preto 99=Solido

