# block.properties
# mc_Entity.x is only populated for blocks explicitly listed here -
# Iris/OptiFine don't expose the old numeric block IDs by default on
# modern Minecraft, so lib/lighting.glsl's color-hint lookup (torch,
# lava, redstone) needs this file to have anything to match against.
# If you add resource-pack blocks with custom light colors, extend
# this list and the matching id checks in lib/lighting.glsl together.

block.50=minecraft:torch minecraft:wall_torch minecraft:soul_torch minecraft:soul_wall_torch
block.89=minecraft:glowstone minecraft:sea_lantern minecraft:shroomlight
block.10=minecraft:lava
block.11=minecraft:lava
block.55=minecraft:redstone_wire minecraft:redstone_torch minecraft:redstone_wall_torch
