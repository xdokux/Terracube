##########################################################################
# shaders.properties - Cinematic Realism
##########################################################################

shadowMapResolution = 2048
shadowDistance = 140.0

# colortex1 holds the bloom bright-pass. RGBA16F (floating point,
# unclamped) rather than the default RGBA8 - without this, any pixel
# brighter than 1.0 (which is most of what bloom is supposed to
# catch: sun glow, lava, glowstone) gets clipped to 1.0 before the
# blur even runs, and bloom ends up looking flat/gray instead of
# genuinely HDR.
colortex1Format = RGBA16F

##########################################################################
# In-game options menu - grouped for readability. Values themselves
# are auto-detected from the "// [values]" comments in lib/settings.glsl.
##########################################################################

screen = <empty> SHADOW_RES SHADOW_DISTANCE PCF_TAPS SHADOW_DISTORTION \
         <empty> COLORED_LIGHT_HINTS MIN_AMBIENT \
         <empty> GOLDEN_HOUR_STRENGTH SUN_GLOW_SIZE \
         <empty> CLOUDS CLOUD_COVERAGE \
         <empty> HEIGHT_FOG HEIGHT_FOG_DENSITY \
         <empty> BLOOM BLOOM_THRESHOLD BLOOM_INTENSITY \
         <empty> RAIN_RIPPLES PUDDLES PUDDLE_COVERAGE \
         <empty> EXPOSURE

sliderOptions = SHADOW_RES SHADOW_DISTANCE PCF_TAPS SHADOW_DISTORTION MIN_AMBIENT \
                GOLDEN_HOUR_STRENGTH SUN_GLOW_SIZE CLOUD_COVERAGE HEIGHT_FOG_DENSITY \
                BLOOM_THRESHOLD BLOOM_INTENSITY PUDDLE_COVERAGE EXPOSURE

##########################################################################
# Buffer wiring
##########################################################################

composite.program.colortex0 = colortex0
composite1.program.colortex1 = colortex1
composite2.program.colortex0 = colortex0
final.program.colortex0 = colortex0
