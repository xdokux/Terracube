##########################################################################
# shaders.properties - Vanilla Dynamic Shadows
##########################################################################

shadowMapResolution = 1024
shadowDistance = 72.0

# Required for lib/shadows.glsl and composite.fsh's use of
# sampler2DShadow - without this, Iris won't configure the shadow
# texture's GL_TEXTURE_COMPARE_MODE, and the hardware-filtered
# texture() compare those files rely on won't work correctly.
shadowHardwareFiltering = true

##########################################################################
# Options menu
##########################################################################

screen = <empty> SHADOW_RES SHADOW_DISTANCE NORMAL_OFFSET_TEXELS \
         <empty> GODRAYS GODRAY_STEPS GODRAY_DISTANCE GODRAY_INTENSITY

sliderOptions = SHADOW_RES SHADOW_DISTANCE NORMAL_OFFSET_TEXELS GODRAY_STEPS GODRAY_DISTANCE GODRAY_INTENSITY

composite.program.colortex0 = colortex0
