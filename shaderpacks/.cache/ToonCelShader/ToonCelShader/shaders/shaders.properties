##########################################################################
# shaders.properties - Toon Cel Shader
##########################################################################

shadowMapResolution = 1024
shadowDistance = 100.0

# colortex1 stores view-space normals (0..1 remapped) for the outline
# pass. Default RGBA8 is fine here - normals don't need HDR range,
# unlike the bloom buffer in a different pack in this series.

screen = <empty> LIGHT_BANDS SHADOW_RES \
         <empty> OUTLINES OUTLINE_THICKNESS OUTLINE_DEPTH_SENSITIVITY OUTLINE_NORMAL_SENSITIVITY \
         <empty> SATURATION POSTERIZE_LEVELS RIM_LIGHT_STRENGTH

sliderOptions = LIGHT_BANDS SHADOW_RES OUTLINE_THICKNESS OUTLINE_DEPTH_SENSITIVITY \
                OUTLINE_NORMAL_SENSITIVITY SATURATION POSTERIZE_LEVELS RIM_LIGHT_STRENGTH

composite.program.colortex0 = colortex0
composite.program.colortex1 = colortex1
final.program.colortex0 = colortex0
