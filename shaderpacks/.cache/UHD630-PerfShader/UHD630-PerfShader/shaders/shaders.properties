# =====================================================================
# UHD630-PerfShader
# Target: Intel UHD 630, 60fps minimum, Sodium 0.6.13 + Iris 1.8.8
# =====================================================================

# ---- Shadow map ----
# Kept small on purpose. Shadow map cost scales with resolution^2, so
# this is the single biggest performance lever in the whole pack.
shadowMapResolution=1024
shadowDistance=96.0
shadowDistanceRenderMul=1.0
# Only render the shadow map every other frame region is NOT exposed
# as a simple toggle in this Iris version to my knowledge - flagging
# this as a possible extra optimization to look up manually if you
# want to push further (search "shadow map caching Iris").

# ---- Buffer formats ----
# colortex0 = main scene color (default RGBA8, not declared = default)
# colortex1 = view-space normal (rgb, packed 0-1) + material mask (a)
#             a = 0.0 -> opaque terrain, a = 1.0 -> water/reflective
colortex1Format=RGBA8

# ---- User-facing sliders ----
# These just tell the in-game shader GUI which #defines to expose.
# The actual value RANGE for each slider is declared as an inline
# comment next to the #define itself, inside the .fsh files
# (this is the standard, well-documented OptiFine/Iris mechanism -
# I'm intentionally not using any shaders.properties slider-range
# syntax here since I'm not fully certain of its exact form in
# Iris 1.8.8 specifically, and getting it wrong would silently break
# the GUI rather than just failing to compile).
sliders=SHADOW_DARKNESS GODRAY_STRENGTH

# ---- Notes ----
# No SSAO, no TAA, no volumetric fog, no bloom composite pass.
# These are intentionally omitted - they are the most common cause of
# sub-60fps performance on integrated graphics and were not requested.
