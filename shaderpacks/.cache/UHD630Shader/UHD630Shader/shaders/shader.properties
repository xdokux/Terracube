## UHD630Shader - shader.properties
## A minimal Iris shader pack: shadows + screen-space godrays + water SSR
## Tuned for Intel UHD 630 (no dedicated VRAM, weak fill rate).

# --- Shadow map resolution (bigger = slower). 1024 is already a compromise. ---
shadowMapResolution=1024

# --- Performance profiles (accessible from the in-game shader options screen) ---
# LOW is the DEFAULT on purpose - this pack assumes weak integrated graphics.
profile.LOW=SSR_STEPS:6 GODRAY_SAMPLES:4 SHADOW_DISTANCE_BLOCKS:64
profile.DEFAULT=SSR_STEPS:6 GODRAY_SAMPLES:4 SHADOW_DISTANCE_BLOCKS:64
profile.MEDIUM=SSR_STEPS:12 GODRAY_SAMPLES:8 SHADOW_DISTANCE_BLOCKS:96
profile.HIGH=SSR_STEPS:20 GODRAY_SAMPLES:12 SHADOW_DISTANCE_BLOCKS:128

# --- In-game options screen layout ---
sliders=SSR_STEPS SSR_MAX_DIST GODRAY_SAMPLES
screen=<empty>
screen.[1]=SSR_STEPS SSR_MAX_DIST
screen.[2]=GODRAY_SAMPLES

SSR_STEPS.comment=Reflection raymarch steps. Lower = faster, blockier reflections.
SSR_MAX_DIST.comment=Max distance (blocks) a reflection ray travels before giving up.
GODRAY_SAMPLES.comment=Godray sample count. Lower = faster, slightly banded godrays.

# --- Colortex buffer formats: keep these LOW PRECISION on purpose. ---
# RGBA8 instead of RGBA16F halves the bandwidth cost of every buffer read/write,
# which matters far more on shared-memory iGPUs than on discrete cards.
colortex0Format=RGBA8
colortex1Format=RGBA8
colortex2Format=R8

# --- Composite pass render targets are declared per-file via /* DRAWBUFFERS */ ---
