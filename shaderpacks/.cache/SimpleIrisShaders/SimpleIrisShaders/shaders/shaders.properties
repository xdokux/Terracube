##########################################################################
# shaders.properties
# Loaded by Iris to configure the pack: profiles, shadow map sizing,
# and which #define options show up in the in-game Shader Options menu.
##########################################################################

# Actual GPU-side shadow map render target size. This is a real Iris/
# OptiFine engine property (not a plain #define) - it controls the
# allocated shadow texture, so it has to be set here rather than only
# in lib/settings.glsl. Keep this equal to the SHADOW_RES #define in
# lib/settings.glsl for each profile below, since shadows.glsl uses
# SHADOW_RES to compute PCF texel offsets and a mismatch would make
# the soft-shadow filtering sample at the wrong spacing.
shadowMapResolution = 1024

# How far out (in blocks) the shadow map covers.
shadowDistance = 96.0

##########################################################################
# Profiles - pick one from the in-game "Shader Packs" screen dropdown.
# Each profile overrides the relevant #defines in lib/settings.glsl
# plus the real shadowMapResolution/shadowDistance engine properties.
##########################################################################

# Tuned specifically for Intel UHD 630 / UHD 620 / Vega 8 class
# integrated graphics. This is NOT just "normal with everything
# turned down further" - shadow resolution and PCF taps are cut hard
# because iGPUs are bandwidth/fill-rate bound rather than ALU bound,
# and god rays are disabled outright since raymarch loops are the
# worst case for weak parallelism hardware.
# Cost: lowest in the pack. Target: 30+ fps @ 1080p, render distance 8.
profile.igpu = shadowMapResolution:512 shadowDistance:48.0 SHADOW_RES:512 SHADOW_DISTANCE:48.0 PCF_TAPS:1 GODRAYS:0 GODRAY_STEPS:6 TONEMAP_STRENGTH:0.75

# Default profile. Shadows at a reasonable resolution, soft PCF edges,
# god rays on with a moderate step count. Aimed at GTX 1660 / RX 5600
# class hardware and above at 1080p, render distance 10+.
# Cost: moderate - this is the "just looks nice" profile.
profile.normal = shadowMapResolution:1024 shadowDistance:96.0 SHADOW_RES:1024 SHADOW_DISTANCE:96.0 PCF_TAPS:2 GODRAYS:1 GODRAY_STEPS:12 TONEMAP_STRENGTH:0.85

##########################################################################
# In-game options menu
# Iris auto-detects the "// [values]" comment syntax on #define lines
# in lib/settings.glsl and builds sliders/dropdowns from it directly -
# no separate registration needed here. This "screen" block just
# controls the ORDER/GROUPING options appear in, which is optional but
# keeps the menu from being an unsorted wall of sliders.
##########################################################################

screen = <empty> SHADOW_RES SHADOW_DISTANCE PCF_TAPS <empty> GODRAYS GODRAY_STEPS <empty> TONEMAP_STRENGTH

sliderOptions = SHADOW_RES SHADOW_DISTANCE PCF_TAPS GODRAY_STEPS TONEMAP_STRENGTH

##########################################################################
# Program-to-buffer wiring
# This pack renders straight to colortex0 in every gbuffers_* stage
# (no G-buffer/deferred split), so composite/final just need to know
# they're reading and writing that same single color buffer.
##########################################################################

composite.program.colortex0 = colortex0
final.program.colortex0 = colortex0
